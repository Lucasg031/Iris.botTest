<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg: #0a0e1a;
  --surface: #111827;
  --surface2: #1a2235;
  --accent: #4f8ef7;
  --accent2: #7c6bf7;
  --accent-glow: rgba(79,142,247,0.15);
  --green: #10d98a;
  --red: #ff5b5b;
  --yellow: #ffc046;
  --text: #e8eaf0;
  --muted: #6b7280;
  --border: rgba(255,255,255,0.07);
  --bot-bubble: linear-gradient(135deg, #1e3a5f, #1a2d4f);
  --user-bubble: linear-gradient(135deg, #1f2d4a, #172440);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* HEADER */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
  position: relative;
}
.header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0.4;
}
.bot-avatar {
  width: 44px; height: 44px;
  border-radius: 14px;
  background: linear-gradient(135deg, #1e3a6e, #2d1f6e);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  position: relative;
  flex-shrink: 0;
  box-shadow: 0 0 20px rgba(79,142,247,0.25);
}
.online-dot {
  position: absolute;
  bottom: -2px; right: -2px;
  width: 11px; height: 11px;
  background: var(--green);
  border-radius: 50%;
  border: 2px solid var(--surface);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(16,217,138,0.4); }
  50% { box-shadow: 0 0 0 5px rgba(16,217,138,0); }
}
.bot-info { flex: 1; }
.bot-name {
  font-family: 'Syne', sans-serif;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.bot-status {
  font-size: 12px;
  color: var(--green);
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 1px;
}
.company-badge {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 11px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
}

/* CHAT AREA */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}
.chat-area::-webkit-scrollbar { width: 4px; }
.chat-area::-webkit-scrollbar-track { background: transparent; }
.chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* MESSAGES */
.msg-row {
  display: flex;
  gap: 10px;
  max-width: 85%;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg-row.bot { align-self: flex-start; }
.msg-row.user { align-self: flex-end; flex-direction: row-reverse; }

.msg-avatar-sm {
  width: 32px; height: 32px;
  border-radius: 10px;
  background: linear-gradient(135deg, #1e3a6e, #2d1f6e);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
  margin-top: 2px;
}
.msg-row.user .msg-avatar-sm {
  background: var(--surface2);
}

.msg-content { display: flex; flex-direction: column; gap: 4px; }
.msg-row.user .msg-content { align-items: flex-end; }

.bubble {
  padding: 13px 16px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.65;
  max-width: 100%;
}
.msg-row.bot .bubble {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
  color: var(--text);
}
.msg-row.user .bubble {
  background: linear-gradient(135deg, #1e3a6e, #253570);
  border: 1px solid rgba(79,142,247,0.2);
  border-bottom-right-radius: 4px;
  color: #c8d8ff;
}

.msg-time {
  font-size: 10px;
  color: var(--muted);
  padding: 0 4px;
  font-family: 'DM Mono', monospace;
}

/* TYPING INDICATOR */
.typing {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 13px 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 16px;
  border-bottom-left-radius: 4px;
  width: fit-content;
}
.typing span {
  width: 7px; height: 7px;
  background: var(--muted);
  border-radius: 50%;
  animation: bounce 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%,60%,100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* QUICK REPLIES */
.quick-replies {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 0 20px 12px;
  flex-shrink: 0;
}
.qr-btn {
  padding: 8px 14px;
  border-radius: 100px;
  border: 1px solid rgba(79,142,247,0.35);
  color: var(--accent);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  background: rgba(79,142,247,0.06);
  font-family: 'DM Sans', sans-serif;
  transition: all .18s;
  white-space: nowrap;
}
.qr-btn:hover {
  background: rgba(79,142,247,0.15);
  border-color: var(--accent);
  transform: translateY(-1px);
}

/* INPUT */
.input-area {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  gap: 10px;
  align-items: flex-end;
  flex-shrink: 0;
}
.input-wrap {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 14px;
  display: flex;
  align-items: center;
  padding: 10px 14px;
  gap: 8px;
  transition: border-color .2s;
}
.input-wrap:focus-within {
  border-color: rgba(79,142,247,0.4);
  box-shadow: 0 0 0 3px rgba(79,142,247,0.08);
}
#userInput {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
  resize: none;
  max-height: 100px;
  line-height: 1.5;
}
#userInput::placeholder { color: var(--muted); }
.send-btn {
  width: 40px; height: 40px;
  background: var(--accent);
  border: none;
  border-radius: 12px;
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all .18s;
  font-size: 16px;
}
.send-btn:hover:not(:disabled) {
  background: #6fa3ff;
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(79,142,247,0.4);
}
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* DISCLAIMER */
.disclaimer {
  text-align: center;
  font-size: 10.5px;
  color: var(--muted);
  padding: 6px 20px 14px;
  flex-shrink: 0;
}

/* DATE DIVIDER */
.date-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--muted);
  font-size: 11px;
  font-family: 'DM Mono', monospace;
}
.date-divider::before, .date-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* GLOW BG */
body::before {
  content: '';
  position: fixed;
  top: -200px; left: -200px;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(79,142,247,0.06), transparent 60%);
  pointer-events: none;
}
body::after {
  content: '';
  position: fixed;
  bottom: -200px; right: -200px;
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(124,107,247,0.05), transparent 60%);
  pointer-events: none;
}
</style>

let conversationHistory = [];
let isLoading = false;

function getTime() {
  return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

function addMessage(role, text, time) {
  const chatArea = document.getElementById('chatArea');
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  const avatarEmoji = role === 'bot' ? '🌟' : '👤';
  const formattedText = text.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

  row.innerHTML = `
    <div class="msg-avatar-sm">${avatarEmoji}</div>
    <div class="msg-content">
      <div class="bubble">${formattedText}</div>
      <div class="msg-time">${time || getTime()}</div>
    </div>`;
  chatArea.appendChild(row);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function showTyping() {
  const chatArea = document.getElementById('chatArea');
  const typingRow = document.createElement('div');
  typingRow.className = 'msg-row bot';
  typingRow.id = 'typingIndicator';
  typingRow.innerHTML = `
    <div class="msg-avatar-sm">🌟</div>
    <div class="msg-content">
      <div class="typing"><span></span><span></span><span></span></div>
    </div>`;
  chatArea.appendChild(typingRow);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function setQuickReplies(replies) {
  const qr = document.getElementById('quickReplies');
  qr.innerHTML = '';
  replies.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'qr-btn';
    btn.textContent = r;
    btn.onclick = () => {
      document.getElementById('userInput').value = r;
      sendMessage();
    };
    qr.appendChild(btn);
  });
}

async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('quickReplies').innerHTML = '';
  addMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });

  isLoading = true;
  document.getElementById('sendBtn').disabled = true;
  showTyping();

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: conversationHistory
      })
    });

    const data = await response.json();
    hideTyping();

    if (data.content && data.content[0]) {
      const reply = data.content[0].text;
      conversationHistory.push({ role: 'assistant', content: reply });
      addMessage('bot', reply);

      // Smart quick replies based on context
      const lower = text.toLowerCase();
      if (lower.includes('benefício') || lower.includes('plano') || lower.includes('saúde')) {
        setQuickReplies(['Sobre o VT', 'Vale-refeição', 'Plano odontológico', 'Gympass']);
      } else if (lower.includes('horário') || lower.includes('jornada') || lower.includes('home office')) {
        setQuickReplies(['Banco de horas', 'Ponto eletrônico', 'Dias presenciais', 'Horas extras']);
      } else if (lower.includes('férias') || lower.includes('licença') || lower.includes('folga')) {
        setQuickReplies(['Day off aniversário', 'Licença maternidade', 'Licença paternidade', 'Banco de horas']);
      } else {
        setQuickReplies(['Meus benefícios', 'Jornada de trabalho', 'Cultura da empresa', 'Falar com RH']);
      }
    } else {
      addMessage('bot', 'Desculpe, tive um problema técnico. Pode repetir sua pergunta? 😊');
    }
  } catch (err) {
    hideTyping();
    addMessage('bot', 'Ops, ocorreu um erro de conexão. Tente novamente em instantes. 🔄');
    console.error(err);
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}

// Auto-resize textarea
document.getElementById('userInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

document.getElementById('userInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
